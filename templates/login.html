{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
    <style>
        body { background: linear-gradient(120deg, #1f2d3d, #4b6cb7); min-height: 100vh; }
        .login-card { max-width: 420px; margin: 8vh auto; background: #fff; border-radius: 12px; padding: 32px; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
    </style>
    <div class="login-card">
        <h3 class="text-center mb-4">🛡️ Security Tools</h3>
        <form method="POST" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="d-grid gap-2 d-md-flex justify-content-md-between">
                <button type="submit" name="action" value="login" class="btn btn-primary">Login</button>
                <button type="submit" name="action" value="register" class="btn btn-outline-secondary">Register</button>
            </div>
        </form>
    </div>
{% endblock %}
