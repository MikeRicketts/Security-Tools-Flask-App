{% extends "base.html" %}
{% block title %}Admin{% endblock %}
{% block content %}
    <h2>User Management</h2>
    <table class="table table-bordered align-middle">
        <thead><tr><th>Username</th><th>Role</th><th>Actions</th></tr></thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.username }}</td>
                <td>{{ user.role }}</td>
                <td>
                    {% if not user.is_admin %}
                        <form method="POST" action="{{ url_for('admin.promote', user_id=user.id) }}" class="d-inline">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <button type="submit" class="btn btn-sm btn-primary">Promote to Admin</button>
                        </form>
                        <form method="POST" action="{{ url_for('admin.remove_user', user_id=user.id) }}" class="d-inline">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Remove</button>
                        </form>
                    {% else %}
                        <span class="text-muted">—</span>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
